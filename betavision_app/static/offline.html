<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetaVision isn't running</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="panel center">
    <h2>BetaVision isn't running</h2>
    <p class="hint">The app does its work on this computer, so its small server needs to be running first.</p>
    <p class="hint">On Windows, open <b>BetaVision</b> from the Start menu or the desktop shortcut.
      Elsewhere, run <code>python -m betavision_app</code> in the BetaVision folder.</p>
    <button class="btn primary" type="button" onclick="location.reload()">Try again</button>
  </section>
</main>
</body>
</html>
